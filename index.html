<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="importmap">
    { "imports": 
      {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #controls-help, #score, #phase-message, #lives {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 8px 12px;
      color: #fff;
      background: rgb(0 0 0 / 55%);
      border-radius: 4px;
      font: 14px sans-serif;
      pointer-events: none;
    }

    #score {
      left: auto;
      right: 16px;
    }

    #phase-message {
      top: 62px;
    }

    #phase-message:empty {
      display: none;
    }

    #lives {
      top: 62px;
      left: auto;
      right: 16px;
    }

    #game-over {
      width: min(360px, calc(100vw - 64px));
      box-sizing: border-box;
      padding: 32px;
      border: 2px solid #e9b44c;
      border-radius: 16px;
      color: #fff;
      background: #182b24;
      text-align: center;
      font: 18px sans-serif;
    }

    #game-over::backdrop {
      background: rgb(0 0 0 / 70%);
    }

    #game-over h1 {
      margin-top: 0;
    }

    #restart {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #e9b44c;
      color: #182b24;
      font: bold 16px sans-serif;
      cursor: pointer;
    }

    #restart:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
  <title>Bilby Blitz</title>
</head>

<body>
  <!-- Área reservada para a cena 3D e a interface do jogo. -->
  <main id="game"></main>
  <div id="controls-help">G: câmera livre | Mascote: WASD + Espaço | X: golpear | Câmera livre: WASD, Q/E e setas</div>
  <div id="score" role="status" aria-live="polite">Pontos: 0</div>
  <div id="lives" role="status" aria-live="polite"></div>
  <div id="phase-message" role="status" aria-live="polite"></div>
  <dialog id="game-over" aria-labelledby="game-over-title" aria-describedby="final-score">
    <h1 id="game-over-title">Fim de jogo</h1>
    <p id="final-score"></p>
    <button id="restart" type="button">Jogar novamente</button>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
